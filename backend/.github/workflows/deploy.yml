name: Production Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'

jobs:
  # Production Quality Gate
  production-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate environment variables
        run: |
          echo "🔍 Validating required environment variables..."
          if [ -z "$SUPABASE_URL" ]; then 
            echo "❌ SUPABASE_URL is missing"
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then 
            echo "❌ SUPABASE_SERVICE_ROLE_KEY is missing"
            exit 1
          fi
          echo "✅ Environment variables validated"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Block forbidden patterns (Strict)
        run: |
          echo "🚫 Checking for forbidden patterns..."
          
          # Block Supabase client in frontend
          if grep -r "@supabase/supabase-js" frontend/ 2>/dev/null; then
            echo "❌ Found Supabase client in frontend - security violation"
            exit 1
          fi
          
          if grep -r "createClient(" frontend/ 2>/dev/null; then
            echo "❌ Found Supabase createClient in frontend - security violation"
            exit 1
          fi
          
          # Block service role keys in frontend
          if grep -r "SUPABASE_SERVICE_ROLE_KEY" frontend/ 2>/dev/null; then
            echo "❌ Found service role key in frontend - security violation"
            exit 1
          fi
          
          # Block exposed JWT keys
          if grep -r "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9" . --exclude-dir=node_modules --exclude-dir=.git 2>/dev/null; then
            echo "❌ Found exposed JWT keys - security violation"
            exit 1
          fi
          
          # Block direct DB connections
          if grep -r "pg://\|postgresql://" . --exclude-dir=node_modules --exclude-dir=.git 2>/dev/null; then
            echo "❌ Found direct DB connection strings - security violation"
            exit 1
          fi
          
          # Block hardcoded secrets
          if grep -r "sk_\|pk_\|secret_\|token_" . --exclude-dir=node_modules --exclude-dir=.git 2>/dev/null; then
            echo "❌ Found potential hardcoded secrets - security violation"
            exit 1
          fi
          
          echo "✅ No forbidden patterns found"

      - name: Build and typecheck
        run: |
          cd backend
          echo "🏗️ Building and typechecking..."
          npm run build
          npx tsc --noEmit
          echo "✅ Build and typecheck passed"

      - name: Security schema validation
        run: |
          cd backend
          echo "🔒 Running security schema validation..."
          node scripts/security.enforcement.ci.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Start backend for testing
        run: |
          cd backend
          echo "🚀 Starting backend server..."
          
          # Create test environment file
          cat > .env.test << EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NODE_ENV=test
          PORT=5000
          FRONTEND_URL=http://localhost:3000
          EOF
          
          # Start server in background
          npm start &
          
          # Wait for server to be ready
          echo "⏳ Waiting for server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:5000/ > /dev/null; then
              echo "✅ Server is ready"
              break
            fi
            echo "⏳ Waiting... ($i/30)"
            sleep 2
          done
          
          # Final check
          if ! curl -s http://localhost:5000/ > /dev/null; then
            echo "❌ Server failed to start"
            exit 1
          fi

      - name: Restart validation (Race condition test)
        run: |
          cd backend
          echo "🔄 Testing server restart stability..."
          
          # Kill existing server
          pkill -f "node dist/index.js" || true
          sleep 2
          
          # Restart server
          npm start &
          
          # Wait for restart
          for i in {1..20}; do
            if curl -s http://localhost:5000/ > /dev/null; then
              echo "✅ Server restarted successfully"
              break
            fi
            echo "⏳ Waiting for restart... ($i/20)"
            sleep 1
          done
          
          # Final restart check
          if ! curl -s http://localhost:5000/ > /dev/null; then
            echo "❌ Server restart failed"
            exit 1
          fi
          
          # Test API after restart
          if ! curl -s http://localhost:5000/api/content > /dev/null; then
            echo "❌ API not responding after restart"
            exit 1
          fi
          
          echo "✅ Restart validation passed"

      - name: API behavior validation
        run: |
          cd backend
          echo "🧪 Running API behavior tests..."
          node ../scripts/test-api.js

      - name: Membership logic enforcement
        run: |
          cd backend
          echo "🔐 Testing membership logic enforcement..."
          
          # Test 1: Content endpoint should require membership
          echo "Testing content endpoint without membership..."
          CONTENT_RESPONSE=$(curl -s -w "%{http_code}" http://localhost:5000/api/content)
          if [[ $CONTENT_RESPONSE != *"403"* ]] && [[ $CONTENT_RESPONSE != *"401"* ]]; then
            echo "❌ Content endpoint should require membership (got: $CONTENT_RESPONSE)"
            exit 1
          fi
          echo "✅ Content endpoint correctly requires membership"
          
          # Test 2: Public endpoints should work
          echo "Testing public health endpoint..."
          HEALTH_RESPONSE=$(curl -s -w "%{http_code}" http://localhost:5000/)
          if [[ $HEALTH_RESPONSE != *"200"* ]]; then
            echo "❌ Health endpoint should be public (got: $HEALTH_RESPONSE)"
            exit 1
          fi
          echo "✅ Health endpoint correctly public"
          
          # Test 3: Protected endpoints should require auth
          echo "Testing protected favorites endpoint..."
          FAVORITES_RESPONSE=$(curl -s -w "%{http_code}" http://localhost:5000/api/favorites)
          if [[ $FAVORITES_RESPONSE != *"401"* ]]; then
            echo "❌ Favorites endpoint should require authentication (got: $FAVORITES_RESPONSE)"
            exit 1
          fi
          echo "✅ Favorites endpoint correctly requires authentication"
          
          echo "🎉 Membership logic enforcement passed!"

      - name: Memory pressure validation (Trend-based)
        run: |
          cd backend
          echo "🧠 Testing memory pressure trends during load..."
          
          # Create memory monitor script
          cat > memory_monitor.js << 'EOF'
          const initial = process.memoryUsage();
          const growthThresholdMB = 50;
          const maxMemoryMB = 300;
          
          function checkMemory() {
            const current = process.memoryUsage();
            const heapUsedMB = Math.round(current.heapUsed / 1024 / 1024);
            const growthMB = Math.round((current.heapUsed - initial.heapUsed) / 1024 / 1024);
            
            // Check absolute threshold
            if (heapUsedMB > maxMemoryMB) {
              console.error(`❌ Memory threshold exceeded: ${heapUsedMB}MB > ${maxMemoryMB}MB`);
              process.exit(1);
            }
            
            // Check growth trend
            if (growthMB > growthThresholdMB) {
              console.error(`❌ Memory growth detected: +${growthMB}MB growth > ${growthThresholdMB}MB threshold`);
              process.exit(1);
            }
            
            console.log(`Memory: ${heapUsedMB}MB (growth: +${growthMB}MB)`);
          }
          
          // Monitor memory every 5 seconds for 30 seconds
          let count = 0;
          const interval = setInterval(() => {
            checkMemory();
            count++;
            if (count >= 6) {
              clearInterval(interval);
              console.log('✅ Memory pressure test passed - no leaks detected');
              process.exit(0);
            }
          }, 5000);
          
          // Initial check
          checkMemory();
          EOF
          
          # Run memory monitor in background
          node memory_monitor.js &
          MEMORY_PID=$!
          
          # Apply sustained load while monitoring
          echo "Applying sustained load..."
          for i in {1..30}; do
            curl -s http://localhost:5000/api/content > /dev/null &
            curl -s http://localhost:5000/ > /dev/null &
            sleep 1
          done
          
          # Wait for memory test to complete
          wait $MEMORY_PID
          
          # Cleanup
          rm -f memory_monitor.js

      - name: Staged Load Testing (Tail latency)
        run: |
          cd backend
          echo "⚡ Running staged production load tests with tail latency checks..."
          
          # Install autocannon if not present
          npm install -g autocannon
          
          # Stage 1: Baseline load
          echo "🔥 Stage 1: Baseline load (50 users, 20s)"
          autocannon -c 50 -d 20 http://localhost:5000/api/content > stage1_result.txt
          cat stage1_result.txt
          
          # Check Stage 1 performance
          STAGE1_AVG=$(grep "Avg" stage1_result.txt | awk '{print $2}' | sed 's/ms//')
          STAGE1_P95=$(grep "95%" stage1_result.txt | awk '{print $2}' | sed 's/ms//')
          STAGE1_P99=$(grep "99%" stage1_result.txt | awk '{print $2}' | sed 's/ms//')
          
          if (( $(echo "$STAGE1_AVG > 500" | bc -l) )); then
            echo "❌ Stage 1 failed: Average latency ${STAGE1_AVG}ms > 500ms"
            exit 1
          fi
          if (( $(echo "$STAGE1_P95 > 1000" | bc -l) )); then
            echo "❌ Stage 1 failed: P95 latency ${STAGE1_P95}ms > 1000ms"
            exit 1
          fi
          if (( $(echo "$STAGE1_P99 > 1500" | bc -l) )); then
            echo "❌ Stage 1 failed: P99 latency ${STAGE1_P99}ms > 1500ms"
            exit 1
          fi
          echo "✅ Stage 1 passed: Avg ${STAGE1_AVG}ms, P95 ${STAGE1_P95}ms, P99 ${STAGE1_P99}ms"
          
          # Stage 2: Medium load
          echo "🔥 Stage 2: Medium load (100 users, 30s)"
          autocannon -c 100 -d 30 http://localhost:5000/api/content > stage2_result.txt
          cat stage2_result.txt
          
          # Check Stage 2 performance
          STAGE2_AVG=$(grep "Avg" stage2_result.txt | awk '{print $2}' | sed 's/ms//')
          STAGE2_P95=$(grep "95%" stage2_result.txt | awk '{print $2}' | sed 's/ms//')
          STAGE2_P99=$(grep "99%" stage2_result.txt | awk '{print $2}' | sed 's/ms//')
          
          if (( $(echo "$STAGE2_AVG > 500" | bc -l) )); then
            echo "❌ Stage 2 failed: Average latency ${STAGE2_AVG}ms > 500ms"
            exit 1
          fi
          if (( $(echo "$STAGE2_P95 > 1200" | bc -l) )); then
            echo "❌ Stage 2 failed: P95 latency ${STAGE2_P95}ms > 1200ms"
            exit 1
          fi
          if (( $(echo "$STAGE2_P99 > 2000" | bc -l) )); then
            echo "❌ Stage 2 failed: P99 latency ${STAGE2_P99}ms > 2000ms"
            exit 1
          fi
          echo "✅ Stage 2 passed: Avg ${STAGE2_AVG}ms, P95 ${STAGE2_P95}ms, P99 ${STAGE2_P99}ms"
          
          # Stage 3: High load (burst test)
          echo "🔥 Stage 3: High load burst (200 users, 15s)"
          autocannon -c 200 -d 15 http://localhost:5000/api/content > stage3_result.txt
          cat stage3_result.txt
          
          # Check Stage 3 performance
          STAGE3_AVG=$(grep "Avg" stage3_result.txt | awk '{print $2}' | sed 's/ms//')
          STAGE3_P95=$(grep "95%" stage3_result.txt | awk '{print $2}' | sed 's/ms//')
          STAGE3_P99=$(grep "99%" stage3_result.txt | awk '{print $2}' | sed 's/ms//')
          
          if (( $(echo "$STAGE3_AVG > 800" | bc -l) )); then
            echo "❌ Stage 3 failed: Average latency ${STAGE3_AVG}ms > 800ms (burst tolerance)"
            exit 1
          fi
          if (( $(echo "$STAGE3_P95 > 1500" | bc -l) )); then
            echo "❌ Stage 3 failed: P95 latency ${STAGE3_P95}ms > 1500ms (burst tolerance)"
            exit 1
          fi
          if (( $(echo "$STAGE3_P99 > 2500" | bc -l) )); then
            echo "❌ Stage 3 failed: P99 latency ${STAGE3_P99}ms > 2500ms (burst tolerance)"
            exit 1
          fi
          echo "✅ Stage 3 passed: Avg ${STAGE3_AVG}ms, P95 ${STAGE3_P95}ms, P99 ${STAGE3_P99}ms"
          
          echo "🎉 All load tests passed - System meets performance SLAs!"

      - name: Failure simulation (Crash + Recovery)
        run: |
          cd backend
          echo "💥 Testing system resilience under failure conditions..."
          
          # Test 1: Simulate server crash and recovery
          echo "Testing crash recovery..."
          
          # Kill server abruptly
          pkill -9 -f "node dist/index.js" || true
          sleep 2
          
          # Verify server is down
          if curl -s http://localhost:5000/ > /dev/null 2>&1; then
            echo "❌ Server should be down after crash"
            exit 1
          fi
          echo "✅ Server successfully crashed"
          
          # Restart server
          echo "Restarting server..."
          npm start > recovery.log 2>&1 &
          SERVER_PID=$!
          
          # Wait for recovery with timeout
          RECOVERED=false
          for i in {1..30}; do
            if curl -s http://localhost:5000/ > /dev/null 2>&1; then
              echo "✅ Server recovered successfully in ${i}s"
              RECOVERED=true
              break
            fi
            echo "⏳ Waiting for recovery... ($i/30)"
            sleep 1
          done
          
          if [ "$RECOVERED" = false ]; then
            echo "❌ Server failed to recover within 30s"
            cat recovery.log
            exit 1
          fi
          
          # Test 2: Verify functionality after recovery
          echo "Testing functionality after recovery..."
          
          # Test API endpoints
          if ! curl -s http://localhost:5000/api/content > /dev/null; then
            echo "❌ API not working after recovery"
            cat recovery.log
            exit 1
          fi
          
          # Test auth protection still works
          AUTH_RESPONSE=$(curl -s -w "%{http_code}" http://localhost:5000/api/favorites)
          if [[ $AUTH_RESPONSE != *"401"* ]]; then
            echo "❌ Auth protection broken after recovery (got: $AUTH_RESPONSE)"
            exit 1
          fi
          
          # Test 3: Check for errors in recovery logs
          echo "Checking recovery logs for errors..."
          if grep -i "unhandled\|fatal\|panic" recovery.log; then
            echo "❌ Found unhandled errors in recovery logs"
            cat recovery.log
            exit 1
          fi
          
          echo "🎉 Failure simulation passed - System is resilient!"
          
          # Cleanup
          rm -f recovery.log

      - name: Log-based validation (Error pattern detection)
        run: |
          cd backend
          echo "🔍 Validating runtime logs for error patterns..."
          
          # Start server with logging
          npm start > runtime.log 2>&1 &
          SERVER_PID=$!
          
          # Wait for server to start
          sleep 3
          
          # Apply some load to generate logs
          echo "Generating load for log validation..."
          for i in {1..10}; do
            curl -s http://localhost:5000/api/content > /dev/null 2>&1 &
            curl -s http://localhost:5000/ > /dev/null 2>&1 &
            sleep 1
          done
          
          # Wait for logs to accumulate
          sleep 5
          
          # Test 1: Check for unhandled promise rejections
          echo "Checking for unhandled promise rejections..."
          if grep -i "unhandledpromiserejectionwarning" runtime.log; then
            echo "❌ Found unhandled promise rejections in logs"
            cat runtime.log
            exit 1
          fi
          
          # Test 2: Check for memory leaks in logs
          echo "Checking for memory leak patterns..."
          if grep -i "memory leak" runtime.log; then
            echo "❌ Found memory leak indicators in logs"
            cat runtime.log
            exit 1
          fi
          
          # Test 3: Check for fatal errors
          echo "Checking for fatal errors..."
          if grep -i "fatal\|panic\|critical" runtime.log; then
            echo "❌ Found fatal/critical errors in logs"
            cat runtime.log
            exit 1
          fi
          
          # Test 4: Check for database connection errors
          echo "Checking for database connection issues..."
          if grep -i "connection.*failed\|database.*error\|timeout" runtime.log; then
            echo "❌ Found database connection errors in logs"
            cat runtime.log
            exit 1
          fi
          
          # Test 5: Check for excessive warnings
          echo "Checking for excessive warnings..."
          WARNING_COUNT=$(grep -c "warning" runtime.log || echo "0")
          if [ "$WARNING_COUNT" -gt 5 ]; then
            echo "❌ Too many warnings in logs: $WARNING_COUNT warnings"
            cat runtime.log
            exit 1
          fi
          
          # Test 6: Check for proper error handling
          echo "Checking for proper error handling..."
          # Make a request that should fail
          curl -s http://localhost:5000/api/nonexistent > /dev/null 2>&1 || true
          sleep 2
          
          # Verify no unhandled errors from the bad request
          if grep -i "unhandled" runtime.log | tail -5; then
            echo "❌ Found unhandled errors from bad requests"
            cat runtime.log
            exit 1
          fi
          
          echo "✅ Log validation passed - No error patterns detected"
          
          # Cleanup
          pkill -f "node dist/index.js" || true
          rm -f runtime.log

      - name: Degraded states testing (Slow DB simulation)
        run: |
          cd backend
          echo "🐌 Testing system behavior under degraded conditions..."
          
          # Start server with slow DB simulation
          echo "Starting server with slow DB simulation..."
          CI_SLOW_DB=true npm start > degraded.log 2>&1 &
          SERVER_PID=$!
          
          # Wait for server to start
          sleep 3
          
          # Test 1: Verify system still responds under slow DB
          echo "Testing response times under slow DB..."
          START_TIME=$(date +%s%N)
          RESPONSE=$(curl -s -w "%{http_code}" http://localhost:5000/api/content)
          END_TIME=$(date +%s%N)
          
          DURATION=$((($END_TIME - $START_TIME) / 1000000))
          echo "Response time: ${DURATION}ms, Status: $RESPONSE"
          
          # Should still respond, but slower
          if [[ $RESPONSE != *"200"* ]] && [[ $RESPONSE != *"403"* ]]; then
            echo "❌ System should still respond under slow DB (got: $RESPONSE)"
            cat degraded.log
            exit 1
          fi
          
          # Should not timeout (>10s indicates hanging)
          if [ $DURATION -gt 10000 ]; then
            echo "❌ Request timed out under slow DB: ${DURATION}ms > 10000ms"
            cat degraded.log
            exit 1
          fi
          
          # Test 2: Verify no queue buildup
          echo "Testing for request queue buildup..."
          
          # Make multiple concurrent requests
          for i in {1..5}; do
            curl -s http://localhost:5000/api/content > /dev/null &
          done
          
          # Wait for all to complete
          sleep 8
          
          # Check for timeout errors in logs
          if grep -i "timeout\|queue" degraded.log; then
            echo "❌ Found timeout/queue issues under slow DB"
            cat degraded.log
            exit 1
          fi
          
          # Test 3: Verify graceful degradation
          echo "Testing graceful degradation..."
          
          # Check if system returns appropriate error handling
          if grep -i "error\|exception" degraded.log | grep -v "supabase"; then
            echo "❌ Found unhandled errors during degradation"
            cat degraded.log
            exit 1
          fi
          
          echo "✅ Degraded states test passed - System handles slow DB gracefully"
          
          # Cleanup
          pkill -f "node dist/index.js" || true
          rm -f degraded.log

      - name: Concurrency conflict testing (Race conditions)
        run: |
          cd backend
          echo "🏃 Testing system correctness under concurrent load..."
          
          # Start server normally
          npm start > concurrency.log 2>&1 &
          SERVER_PID=$!
          
          # Wait for server to start
          sleep 3
          
          # Test 1: Parallel write conflicts
          echo "Testing parallel write conflicts..."
          
          # Create concurrent requests script
          cat > concurrent_test.js << 'EOF'
          const fetch = require('node-fetch');
          
          async function testConcurrentWrites() {
            const promises = [];
            
            // Make 5 parallel requests to same endpoint
            for (let i = 0; i < 5; i++) {
              promises.push(
                fetch('http://localhost:5000/api/content')
                  .then(res => res.text())
                  .catch(err => ({ error: err.message }))
              );
            }
            
            const results = await Promise.all(promises);
            
            // Check for consistency
            const errors = results.filter(r => r.error);
            const successes = results.filter(r => !r.error);
            
            console.log(`Concurrent requests: ${successes.length} success, ${errors.length} errors`);
            
            if (errors.length > 0) {
              console.log('Errors:', errors);
              process.exit(1);
            }
            
            // Verify responses are consistent
            const uniqueResponses = [...new Set(successes)];
            if (uniqueResponses.length > 2) { // Allow for 403/200 variations
              console.log('Inconsistent responses:', uniqueResponses);
              process.exit(1);
            }
            
            console.log('✅ Concurrent writes handled correctly');
          }
          
          testConcurrentWrites().catch(err => {
            console.error('❌ Concurrency test failed:', err.message);
            process.exit(1);
          });
          EOF
          
          # Run concurrency test
          node concurrent_test.js
          
          # Test 2: Race condition detection
          echo "Testing for race conditions..."
          
          # Make rapid parallel requests
          for i in {1..10}; do
            curl -s http://localhost:5000/api/content > /dev/null &
            curl -s http://localhost:5000/ > /dev/null &
          done
          
          # Wait for completion
          sleep 3
          
          # Check for race condition indicators in logs
          if grep -i "race\|deadlock\|lock" concurrency.log; then
            echo "❌ Found race condition indicators"
            cat concurrency.log
            exit 1
          fi
          
          # Test 3: Data consistency under load
          echo "Testing data consistency under load..."
          
          # Get baseline response
          BASELINE=$(curl -s http://localhost:5000/api/content)
          
          # Apply load
          for i in {1..20}; do
            curl -s http://localhost:5000/api/content > /dev/null &
          done
          
          # Wait for completion
          sleep 2
          
          # Get response after load
          AFTER_LOAD=$(curl -s http://localhost:5000/api/content)
          
          # Responses should be consistent (ignoring timestamps)
          if [ "$BASELINE" != "$AFTER_LOAD" ]; then
            echo "❌ Data inconsistency detected under load"
            echo "Baseline: $BASELINE"
            echo "After load: $AFTER_LOAD"
            exit 1
          fi
          
          echo "✅ Concurrency conflict test passed - System handles race conditions correctly"
          
          # Cleanup
          pkill -f "node dist/index.js" || true
          rm -f concurrency.log concurrent_test.js

      - name: Long-duration stability test (Soak test)
        run: |
          cd backend
          echo "⏱️ Testing system stability over extended duration..."
          
          # Start server
          npm start > soak.log 2>&1 &
          SERVER_PID=$!
          
          # Wait for server to start
          sleep 3
          
          # Install autocannon if not present
          npm install -g autocannon
          
          echo "Starting 2-minute soak test with sustained load..."
          
          # Run sustained load for 2 minutes
          autocannon -c 50 -d 120 http://localhost:5000/api/content > soak_results.txt 2>&1 &
          LOAD_PID=$!
          
          # Monitor system health during soak test
          for i in {1..24}; do
            echo "Soak test progress: $i/24 (5s intervals)"
            
            # Check server is still responding
            if ! curl -s http://localhost:5000/ > /dev/null; then
              echo "❌ Server stopped responding during soak test at $((i*5))s"
              cat soak.log
              exit 1
            fi
            
            # Check for memory leaks (trend-based)
            if [ $((i % 6)) -eq 0 ]; then  # Every 30s
              MEMORY_CHECK=$(ps -o pid,vsz,rss -p $SERVER_PID | tail -1)
              echo "Memory check: $MEMORY_CHECK"
              
              # Simple memory growth detection
              RSS=$(echo $MEMORY_CHECK | awk '{print $3}')
              if [ -n "$RSS" ] && [ "$RSS" -gt 500000 ]; then  # 500MB RSS limit
                echo "❌ Excessive memory usage during soak test: ${RSS}KB"
                cat soak.log
                exit 1
              fi
            fi
            
            # Check for error patterns in logs
            if grep -q "error\|exception\|timeout" soak.log; then
              echo "❌ Found errors during soak test"
              tail -10 soak.log
              exit 1
            fi
            
            sleep 5
          done
          
          # Wait for load test to complete
          wait $LOAD_PID
          
          # Analyze soak test results
          echo "Analyzing soak test results..."
          cat soak_results.txt
          
          # Check for errors in load test
          if grep -i "error\|failed\|timeout" soak_results.txt; then
            echo "❌ Soak test encountered errors"
            cat soak_results.txt
            exit 1
          fi
          
          # Check latency stability
          AVG_LATENCY=$(grep "Avg" soak_results.txt | awk '{print $2}' | sed 's/ms//' || echo "0")
          if [ -n "$AVG_LATENCY" ] && (( $(echo "$AVG_LATENCY > 1000" | bc -l) )); then
            echo "❌ Soak test latency too high: ${AVG_LATENCY}ms"
            exit 1
          fi
          
          # Check request success rate
          SUCCESS_RATE=$(grep -o "[0-9]*%" soak_results.txt | head -1 | sed 's/%//')
          if [ -n "$SUCCESS_RATE" ] && [ "$SUCCESS_RATE" -lt 95 ]; then
            echo "❌ Soak test success rate too low: ${SUCCESS_RATE}%"
            exit 1
          fi
          
          echo "✅ Soak test passed - System stable under extended load"
          
          # Cleanup
          pkill -f "node dist/index.js" || true
          rm -f soak.log soak_results.txt

      - name: External dependency resilience (Retry behavior)
        run: |
          cd backend
          echo "🌐 Testing system resilience under external dependency failures..."
          
          # Test 1: Simulate external service failure
          echo "Testing external service failure handling..."
          
          # Start server with external failure simulation
          CI_FAIL_EXTERNAL=true npm start > external_fail.log 2>&1 &
          SERVER_PID=$!
          
          # Wait for server to start
          sleep 3
          
          # Test system behavior under external failure
          echo "Testing requests during external failure..."
          
          # Make requests that would hit external dependencies
          for i in {1..5}; do
            START_TIME=$(date +%s%N)
            RESPONSE=$(curl -s -w "%{http_code}" http://localhost:5000/api/content)
            END_TIME=$(date +%s%N)
            
            DURATION=$((($END_TIME - $START_TIME) / 1000000))
            echo "Request $i: ${DURATION}ms, Status: $RESPONSE"
            
            # Should handle gracefully (not crash)
            if [[ $RESPONSE == *"000"* ]]; then
              echo "❌ Connection refused - server crashed"
              cat external_fail.log
              exit 1
            fi
            
            # Should timeout gracefully, not hang
            if [ $DURATION -gt 15000 ]; then
              echo "❌ Request hung under external failure: ${DURATION}ms"
              cat external_fail.log
              exit 1
            fi
          done
          
          # Test 2: Verify retry behavior
          echo "Testing retry behavior..."
          
          # Check logs for retry attempts
          if grep -i "retry\|attempt" external_fail.log; then
            echo "✅ Retry behavior detected in logs"
          else
            echo "⚠️  No retry behavior detected (may be acceptable depending on implementation)"
          fi
          
          # Test 3: Verify proper error handling
          echo "Testing proper error handling..."
          
          # Should not have unhandled exceptions
          if grep -i "unhandled\|fatal" external_fail.log; then
            echo "❌ Found unhandled errors during external failure"
            cat external_fail.log
            exit 1
          fi
          
          # Should return appropriate error responses
          ERROR_RESPONSES=$(curl -s -w "%{http_code}" http://localhost:5000/api/content | grep -c "503\|500\|timeout" || echo "0")
          if [ "$ERROR_RESPONSES" -gt 0 ]; then
            echo "✅ Proper error responses returned: $ERROR_RESPONSES error responses"
          else
            echo "⚠️  No error responses detected (may be cached or handled differently)"
          fi
          
          # Test 4: Recovery after external service returns
          echo "Testing recovery after external service restoration..."
          
          # Stop server with failure simulation
          pkill -f "node dist/index.js" || true
          sleep 2
          
          # Start server normally
          npm start > recovery.log 2>&1 &
          SERVER_PID=$!
          
          # Wait for recovery
          sleep 3
          
          # Test that system recovers
          RECOVERY_RESPONSE=$(curl -s -w "%{http_code}" http://localhost:5000/api/content)
          if [[ $RECOVERY_RESPONSE != *"200"* ]] && [[ $RECOVERY_RESPONSE != *"403"* ]]; then
            echo "❌ System failed to recover after external service restoration"
            cat recovery.log
            exit 1
          fi
          
          echo "✅ External dependency resilience test passed - System handles failures gracefully"
          
          # Cleanup
          pkill -f "node dist/index.js" || true
          rm -f external_fail.log recovery.log

      - name: Self-correcting runtime validation
        run: |
          cd backend
          echo "🤖 Testing self-correcting runtime capabilities..."
          
          # Test 1: Circuit breaker functionality
          echo "Testing circuit breaker under failure conditions..."
          
          # Start server with circuit breaker enabled
          CI_FAIL_EXTERNAL=true npm start > circuit_test.log 2>&1 &
          SERVER_PID=$!
          
          sleep 3
          
          # Make multiple requests to trigger circuit breaker
          echo "Triggering circuit breaker..."
          for i in {1..8}; do
            START_TIME=$(date +%s%N)
            RESPONSE=$(curl -s -w "%{http_code}" http://localhost:5000/api/content)
            END_TIME=$(date +%s%N)
            
            DURATION=$((($END_TIME - $START_TIME) / 1000000))
            echo "Request $i: ${DURATION}ms, Status: $RESPONSE"
            
            # Circuit breaker should trigger after 5 failures
            if [ $i -gt 5 ] && [[ $RESPONSE == *"503"* ]]; then
              echo "✅ Circuit breaker triggered correctly"
              break
            fi
            
            sleep 1
          done
          
          # Test 2: Graceful degradation
          echo "Testing graceful degradation..."
          
          # Check if degraded responses are returned
          DEGRADED_RESPONSE=$(curl -s http://localhost:5000/api/content)
          if [[ $DEGRADED_RESPONSE == *"degraded"* ]]; then
            echo "✅ Graceful degradation working correctly"
          else
            echo "⚠️  Graceful degradation may not be active"
          fi
          
          # Test 3: Rate limiting
          echo "Testing rate limiting..."
          
          # Make rapid requests to test rate limiting
          RATE_LIMITED=false
          for i in {1..15}; do
            RATE_RESPONSE=$(curl -s -w "%{http_code}" http://localhost:5000/api/content)
            if [[ $RATE_RESPONSE == *"429"* ]]; then
              echo "✅ Rate limiting triggered correctly"
              RATE_LIMITED=true
              break
            fi
            sleep 0.1
          done
          
          if [ "$RATE_LIMITED" = false ]; then
            echo "⚠️  Rate limiting may not be active"
          fi
          
          # Test 4: Health check endpoint
          echo "Testing health check endpoint..."
          
          HEALTH_RESPONSE=$(curl -s http://localhost:5000/health)
          if [[ $HEALTH_RESPONSE == *"healthy"* ]] || [[ $HEALTH_RESPONSE == *"degraded"* ]]; then
            echo "✅ Health check endpoint responding"
          else
            echo "❌ Health check endpoint not working"
            cat circuit_test.log
            exit 1
          fi
          
          # Test 5: System status endpoint
          echo "Testing system status endpoint..."
          
          STATUS_RESPONSE=$(curl -s http://localhost:5000/system/status)
          if [[ $STATUS_RESPONSE == *"self-correcting"* ]] || [[ $STATUS_RESPONSE == *"autoRestart"* ]]; then
            echo "✅ Self-correcting runtime features active"
          else
            echo "⚠️  Self-correcting runtime may not be fully initialized"
          fi
          
          # Test 6: Recovery simulation
          echo "Testing recovery capabilities..."
          
          # Stop failure simulation
          pkill -f "node dist/index.js" || true
          sleep 2
          
          # Start server normally
          npm start > recovery_test.log 2>&1 &
          SERVER_PID=$!
          
          sleep 3
          
          # Test that system recovers
          RECOVERY_RESPONSE=$(curl -s -w "%{http_code}" http://localhost:5000/api/content)
          if [[ $RECOVERY_RESPONSE != *"000"* ]]; then
            echo "✅ System recovery working correctly"
          else
            echo "❌ System failed to recover"
            cat recovery_test.log
            exit 1
          fi
          
          echo "🎉 Self-correcting runtime validation passed!"
          
          # Cleanup
          pkill -f "node dist/index.js" || true
          rm -f circuit_test.log recovery_test.log

      - name: Cache correctness validation
        run: |
          cd backend
          echo "💾 Testing cache correctness and invalidation..."
          
          # Start server normally
          npm start > cache_test.log 2>&1 &
          SERVER_PID=$!
          
          sleep 3
          
          # Test 1: Cache consistency
          echo "Testing cache consistency..."
          
          # First request should cache data
          INITIAL_RESPONSE=$(curl -s http://localhost:5000/api/content)
          echo "Initial response: $INITIAL_RESPONSE"
          
          # Second request should hit cache
          CACHED_RESPONSE=$(curl -s http://localhost:5000/api/content)
          echo "Cached response: $CACHED_RESPONSE"
          
          # Responses should be consistent
          if [ "$INITIAL_RESPONSE" != "$CACHED_RESPONSE" ]; then
            echo "❌ Cache inconsistency detected"
            echo "Initial: $INITIAL_RESPONSE"
            echo "Cached:  $CACHED_RESPONSE"
            exit 1
          fi
          
          echo "✅ Cache consistency verified"
          
          # Test 2: Cache invalidation
          echo "Testing cache invalidation..."
          
          # Simulate data update (this should invalidate cache)
          UPDATE_RESPONSE=$(curl -s -X POST http://localhost:5000/api/content/refresh -H "Content-Type: application/json")
          echo "Update response: $UPDATE_RESPONSE"
          
          # Next request should get fresh data
          FRESH_RESPONSE=$(curl -s http://localhost:5000/api/content)
          echo "Fresh response: $FRESH_RESPONSE"
          
          # Should not be the stale cached data
          if [ "$FRESH_RESPONSE" == "$CACHED_RESPONSE" ] && [ "$UPDATE_RESPONSE" != *"error"* ]; then
            echo "❌ Cache invalidation failed - still getting stale data"
            exit 1
          fi
          
          echo "✅ Cache invalidation working correctly"
          
          # Test 3: Cache TTL expiration
          echo "Testing cache TTL expiration..."
          
          # Cache some data with short TTL
          TTL_RESPONSE=$(curl -s -H "Cache-Control: max-age=2" http://localhost:5000/api/content)
          echo "TTL response: $TTL_RESPONSE"
          
          # Wait for cache to expire
          sleep 3
          
          # Should get fresh data after TTL
          EXPIRED_RESPONSE=$(curl -s http://localhost:5000/api/content)
          echo "Expired response: $EXPIRED_RESPONSE"
          
          # Check cache stats if available
          CACHE_STATS=$(curl -s http://localhost:5000/system/cache/stats)
          echo "Cache stats: $CACHE_STATS"
          
          if [[ $CACHE_STATS == *"expired"* ]] || [[ $CACHE_STATS == *"invalidated"* ]]; then
            echo "✅ Cache TTL and invalidation stats available"
          else
            echo "⚠️  Cache stats may not be implemented"
          fi
          
          # Test 4: Concurrent cache access
          echo "Testing concurrent cache access..."
          
          # Make multiple concurrent requests
          for i in {1..5}; do
            CONCURRENT_RESPONSE=$(curl -s http://localhost:5000/api/content &)
            echo "Concurrent $i: $CONCURRENT_RESPONSE"
          done
          
          wait
          
          echo "✅ Concurrent cache access completed"
          
          # Test 5: Cache memory management
          echo "Testing cache memory management..."
          
          # Make many requests to fill cache
          for i in {1..20}; do
            curl -s "http://localhost:5000/api/content?test=$i" > /dev/null &
          done
          
          wait
          
          # Check memory usage
          MEMORY_CHECK=$(ps -o pid,vsz,rss -p $SERVER_PID | tail -1)
          echo "Memory usage: $MEMORY_CHECK"
          
          RSS=$(echo $MEMORY_CHECK | awk '{print $3}')
          if [ -n "$RSS" ] && [ "$RSS" -gt 300000 ]; then  # 300MB limit
            echo "⚠️  High memory usage during cache test: ${RSS}KB"
          else
            echo "✅ Cache memory usage within limits"
          fi
          
          echo "🎉 Cache correctness validation passed!"
          
          # Cleanup
          pkill -f "node dist/index.js" || true
          rm -f cache_test.log

      - name: Production security check
        run: |
          cd backend
          echo "🔍 Running production security check..."
          node ../scripts/production.security.check.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up..."
          pkill -f "node dist/index.js" || true
          echo "✅ Cleanup completed"

  # Quality Gates
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compilation check
        run: npm run build

      - name: Run linting
        run: npm run lint || echo "Linting skipped (no script)"

      - name: Run tests
        run: npm test || echo "Tests skipped (no script)"

      - name: Security audit
        run: npm audit --audit-level high

  # Load Testing
  load-test:
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start application for testing
        run: |
          npm start &
          sleep 30

      - name: Run basic load test
        run: |
          # Basic health check
          curl -f http://localhost:5000/ || exit 1
          
          # Simulate 50 concurrent users
          for i in {1..50}; do
            curl -s http://localhost:5000/ > /dev/null &
          done
          wait

      - name: Performance baseline test
        run: |
          # Measure response times
          start_time=$(date +%s%N)
          for i in {1..100}; do
            curl -s http://localhost:5000/ > /dev/null
          done
          end_time=$(date +%s%N)
          
          duration=$((($end_time - $start_time) / 1000000))
          avg_time=$(($duration / 100))
          
          echo "Average response time: ${avg_time}ms"
          
          # Fail if average response time > 500ms
          if [ $avg_time -gt 500 ]; then
            echo "Performance baseline failed: ${avg_time}ms > 500ms"
            exit 1
          fi

  # Deploy to Production
  deploy:
    runs-on: ubuntu-latest
    needs: [production-gate, quality-check, load-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Render
        uses: johnnymanzana/render-deploy@v6
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true

      - name: Deployment-time sanity check
        run: |
          echo "🔍 Performing post-deployment sanity checks..."
          
          # Wait for deployment to be fully ready
          echo "Waiting for deployment to stabilize..."
          sleep 30
          
          # Test 1: Basic health check
          echo "Testing deployed service health..."
          HEALTH_CHECK=$(curl -s -w "%{http_code}" https://gym-backend.onrender.com/ || echo "000")
          echo "Health check status: $HEALTH_CHECK"
          
          if [[ $HEALTH_CHECK != *"200"* ]]; then
            echo "❌ Deployment health check failed: $HEALTH_CHECK"
            exit 1
          fi
          
          # Test 2: API functionality
          echo "Testing deployed API functionality..."
          API_CHECK=$(curl -s -w "%{http_code}" https://gym-backend.onrender.com/api/content || echo "000")
          echo "API check status: $API_CHECK"
          
          if [[ $API_CHECK != *"200"* ]] && [[ $API_CHECK != *"403"* ]]; then
            echo "❌ Deployment API check failed: $API_CHECK"
            exit 1
          fi
          
          # Test 3: Response time check
          echo "Testing deployed response times..."
          START_TIME=$(date +%s%N)
          curl -s https://gym-backend.onrender.com/ > /dev/null
          END_TIME=$(date +%s%N)
          
          RESPONSE_TIME=$((($END_TIME - $START_TIME) / 1000000))
          echo "Response time: ${RESPONSE_TIME}ms"
          
          if [ $RESPONSE_TIME -gt 5000 ]; then
            echo "❌ Deployment response time too slow: ${RESPONSE_TIME}ms > 5000ms"
            exit 1
          fi
          
          # Test 4: Environment validation
          echo "Testing deployed environment..."
          
          # Make a request that would require environment variables
          ENV_CHECK=$(curl -s https://gym-backend.onrender.com/api/content || echo "ENV_ERROR")
          
          if [[ $ENV_CHECK == *"ENV_ERROR"* ]] || [[ $ENV_CHECK == *"database"* ]] || [[ $ENV_CHECK == *"connection"* ]]; then
            echo "❌ Environment configuration issue detected"
            echo "Response: $ENV_CHECK"
            exit 1
          fi
          
          # Test 5: Critical endpoints
          echo "Testing critical endpoints..."
          
          ENDPOINTS=(
            "/"
            "/api/content"
            "/api/membership/me"
          )
          
          for endpoint in "${ENDPOINTS[@]}"; do
            ENDPOINT_CHECK=$(curl -s -w "%{http_code}" "https://gym-backend.onrender.com$endpoint" || echo "000")
            echo "Endpoint $endpoint: $ENDPOINT_CHECK"
            
            if [[ $ENDPOINT_CHECK == *"000"* ]]; then
              echo "❌ Critical endpoint $endpoint is not responding"
              exit 1
            fi
          done
          
          echo "✅ All deployment sanity checks passed - System is live and healthy!"

      - name: Health check after deployment
        run: |
          # Wait for deployment to be ready
          sleep 60
          
          # Check if service is responding
          for i in {1..10}; do
            if curl -f https://gym-backend.onrender.com/; then
              echo "Health check passed"
              exit 0
            fi
            echo "Health check attempt $i failed, retrying..."
            sleep 30
          done
          
          echo "Health check failed after 10 attempts"
          exit 1

      - name: Post-deployment smoke tests
        run: |
          # Test critical endpoints
          curl -f https://gym-backend.onrender.com/ || exit 1
          curl -f https://gym-backend.onrender.com/api/content || exit 1
          curl -f https://gym-backend.onrender.com/api/media/stats || exit 1

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Backend: https://gym-backend.onrender.com"
          echo "Frontend: https://gym-frontend.vercel.app"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Check logs: https://render.com/dashboard/srv-${{ secrets.RENDER_SERVICE_ID }}"

  # Rollback on failure
  rollback:
    runs-on: ubuntu-latest
    needs: deploy
    if: failure() && github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Trigger rollback
        run: |
          echo "🔄 Initiating rollback..."
          
          # Get last successful deployment
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"serviceId": "${{ secrets.RENDER_SERVICE_ID }}", "rollback": true}' \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/rollback

      - name: Verify rollback health
        run: |
          sleep 60
          
          for i in {1..5}; do
            if curl -f https://gym-backend.onrender.com/; then
              echo "✅ Rollback successful"
              exit 0
            fi
            sleep 30
          done
          
          echo "❌ Rollback failed - manual intervention required"
          exit 1

  # Security scan
  security-scan:
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  
