name: Deploy to Production

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build backend
      run: npm run build:backend
    
    - name: Deploy to Render
      uses: johnbeynon/render-deploy-action@v0.0.8
      with:
        service-id: ${{ secrets.RENDER_SERVICE_ID }}
        api-key: ${{ secrets.RENDER_API_KEY }}
    
    - name: Health check
      run: |
        sleep 30  # Wait for deployment
        response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.BACKEND_URL }})
        if [ $response -ne 200 ]; then
          echo "❌ Backend health check failed: $response"
          exit 1
        fi
        echo "✅ Backend health check passed"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build frontend
      run: npm run build:frontend
      env:
        VITE_API_URL: ${{ secrets.BACKEND_URL }}
    
    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod'
        working-directory: ./frontend
    
    - name: Update environment variables
      run: |
        curl -X POST https://api.vercel.com/v9/projects/${{ secrets.VERCEL_PROJECT_ID }}/env \
          -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{
            "key": "VITE_API_URL",
            "value": "${{ secrets.BACKEND_URL }}",
            "type": "system",
            "target": ["production"]
          }'

  post-deploy-validation:
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Production validation
      shell: pwsh
      run: |
        pwsh -ExecutionPolicy Bypass -File scripts/validate-working-final.ps1 -SkipBuild
        
        # Additional production checks
        $backendUrl = "${{ secrets.BACKEND_URL }}"
        $frontendUrl = "${{ secrets.FRONTEND_URL }}"
        
        # Test backend health
        try {
          $response = Invoke-RestMethod -Uri "$backendUrl/" -TimeoutSec 10
          if ($response.status -ne "ok") {
            throw "Backend not healthy"
          }
          Write-Host "✅ Backend health check passed"
        } catch {
          Write-Error "❌ Backend health check failed"
          exit 1
        }
        
        # Test frontend accessibility
        try {
          $response = Invoke-WebRequest -Uri "$frontendUrl" -TimeoutSec 10
          if ($response.StatusCode -ne 200) {
            throw "Frontend not accessible"
          }
          Write-Host "✅ Frontend accessibility check passed"
        } catch {
          Write-Error "❌ Frontend accessibility check failed"
          exit 1
        }
        
        Write-Host "✅ Production validation complete"
