# Render Deployment Configuration
# Deploy with: Copy this to backend folder and push to GitHub, then connect to Render

services:
  - type: web
    name: elite-fitness-backend
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://gym-three-fawn.vercel.app
      - key: SUPABASE_URL
        sync: false  # Set in Render dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false  # Set in Render dashboard (sensitive)
      - key: FIREBASE_PROJECT_ID
        sync: false  # Set in Render dashboard
      - key: FIREBASE_CLIENT_EMAIL
        sync: false  # Set in Render dashboard
      - key: FIREBASE_PRIVATE_KEY
        sync: false  # Set in Render dashboard (sensitive - format with literal \n)
    healthCheckPath: /
    autoDeploy: true
